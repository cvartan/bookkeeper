spring:
    security:
        user:
            name: admin
        ldap:
            base: cn=Users,dc=int,dc=homenet
            user-search-filter: (sAMAccountName={0})
            user-search-base: cn=Users,dc=int,dc=homenet
            group-search-base: dc=int,dc=homenet
            authorities:
                group-search-filter: (member={0})
    ldap:
        urls: ldaps://samba.int.homenet:636
        base: dc=int,dc=homenet
        username: CN=bkapp,CN=Users,DC=int,DC=homenet
        password: BkApp_2025
        anonymous-read-only: false


    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${BK_DB_SERVER_NAME:localhost}:${BK_DB_SERVER_PORT:5432}/${BK_DB_NAME:bk}
        username: ${BK_DB_USER:bk}
        password: ${BK_DB_PASSWORD:bk}

    flyway:
        enabled: false
        

server:
    port: ${BK_APP_PORT:8021}

logging:
  level:
    '[org.springframework.jdbc.datasource]': debug
    '[org.springframework.security.ldap]': trace
    '[org.springframework.ldap]': trace
    '[org.springframework.ldap.core.LdapTemplate]': trace
